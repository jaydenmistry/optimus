# Production compose file for Dokploy.
# In Dokploy set "Compose Path" to ./docker-compose.dokploy.yml.
# Routing (set in Dokploy's Domains tab, not here):
#   optimus.jmistry.com        -> service "frontend", port 3000
#   optimus.jmistry.com/api    -> service "backend",  port 8000
#   optimus.jmistry.com/docs   -> service "backend",  port 8000 (optional)
#   optimus.jmistry.com/openapi.json -> service "backend", port 8000 (optional, needed by /docs)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only needed by the entrypoint to fix volume ownership and drop to the app user
      - CHOWN
      - SETUID
      - SETGID
    expose:
      - "8000"
    volumes:
      - optimus-data:/app/data
    environment:
      ENVIRONMENT: production
      # The demo stores are in Athens, GA: "today", the daily roll-forward and
      # the Peak Hours clock all follow store time
      TZ: ${TZ:-America/New_York}
      # Demo mode: keep the data current and simulate the sensors
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      SIMULATE_SENSORS: ${SIMULATE_SENSORS:-true}
      SIMULATION_INTERVAL_SECONDS: ${SIMULATION_INTERVAL_SECONDS:-20}
      SCENARIOS_ENABLED: ${SCENARIOS_ENABLED:-true}
      DATABASE_URL: sqlite:///data/inventory.db
      CORS_ORIGINS: ${CORS_ORIGINS:-https://optimus.jmistry.com}
      # Needed (as the X-Admin-Token header) to wipe/regenerate demo data.
      # Leave empty to disable that action on the public site.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Needed (as the X-API-Key header) by sensors posting to /api/telemetry.
      # Leave empty to disable sensor ingestion.
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      SECRET_KEY: ${SECRET_KEY:-}
      DEMO_NUM_STORES: ${DEMO_NUM_STORES:-5}
      DEMO_NUM_SKUS: ${DEMO_NUM_SKUS:-200}
      DEMO_DAYS_HISTORY: ${DEMO_DAYS_HISTORY:-60}
    healthcheck:
      # Python instead of curl, so the image needs no extra packages
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot generates the demo data set, which takes a while
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://optimus.jmistry.com}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  optimus-data:
